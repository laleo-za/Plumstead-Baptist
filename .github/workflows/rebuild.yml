# =============================================================================
# Build and publish the Plumstead Baptist Church site to GitHub Pages.
#
# What this does, in plain language:
#   - It builds the website from the templates (runs `python build_static.py`,
#     which also fetches the latest YouTube sermon) and then publishes the
#     freshly built docs/ folder straight to GitHub Pages.
#   - It runs every 6 hours (to pick up new YouTube uploads), whenever you push
#     changes to main, and on demand from the Actions tab.
#
# IMPORTANT one-time setting (only needed once for the repo):
#   On github.com -> Settings -> Pages -> "Build and deployment" ->
#   set Source = "GitHub Actions". This workflow then does the publishing;
#   you no longer commit docs/ back to the repo by hand.
#
# Why this is better than the old approach:
#   The previous version rebuilt docs/ and tried to git-push it back into main.
#   That needed write permissions and could fail on conflicts. Publishing the
#   built site as a Pages "artifact" (below) avoids all of that and is the
#   method GitHub recommends.
# =============================================================================

name: Build and deploy site to GitHub Pages

on:
  # Every 6 hours, on the hour (UTC). Picks up new YouTube uploads automatically.
  schedule:
    - cron: "0 */6 * * *"

  # Whenever source content is pushed to main.
  push:
    branches: [main]

  # Manual "Run workflow" button on the Actions tab.
  workflow_dispatch:

# Permissions the official Pages deployment needs. No "contents: write" is
# required because we no longer push anything back into the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Only let one publish run at a time; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build the static site into docs/ and upload it as a Pages artifact.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build the static site
        run: python build_static.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # ---------------------------------------------------------------------------
  # 2) Publish the uploaded artifact to GitHub Pages.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
